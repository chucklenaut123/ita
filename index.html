<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智创协会 | InTech Association</title>
    <meta name="description" content="智创协会（InTech Association）官网：知识共享，共同进步。" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body data-page="index">
    <div id="navbar"></div>

    <main>
      <section class="hero">
        <div class="hero-content">
          <div class="hero-brand">
            <h1>智创协会</h1>
            <span class="hero-sub">InTech Association</span>
          </div>
          <p class="hero-desc typewriter-desc" data-type-text="面向 AI、编程与创意技术的学生社群。&#10;一起做项目、办活动，把想法变成能被看见的作品。"></p>
          <div class="hero-actions">
            <a href="projects.html" class="btn">看看我们在做什么</a>
            <a href="about.html" class="btn btn-outline">认识智创协会</a>
          </div>
        </div>
      </section>

      <div id="news-carousel" class="reveal"></div>

      <section class="entrance-section">
        <div class="container">
          <h2 class="section-title reveal">探索更多</h2>
          <div class="entrance-grid">
            <a href="members.html" class="entrance-card reveal reveal-d1">
              <div class="bg-image">
                <img src="assets/images/WIP.jpg" alt="核心成员" />
              </div>
              <div class="overlay"></div>
              <div class="card-content">
                <h3>社团核心成员</h3>
                <p>认识推动协会前行的核心力量。</p>
                <span class="btn btn-sm">查看成员</span>
              </div>
            </a>

            <a href="projects.html" class="entrance-card reveal reveal-d2">
              <div class="bg-image">
                <img src="assets/images/WIP.jpg" alt="项目与活动" />
              </div>
              <div class="overlay"></div>
              <div class="card-content">
                <h3>项目与活动</h3>
                <p>浏览我们正在进行与已完结的项目和活动。</p>
                <span class="btn btn-sm">查看项目</span>
              </div>
            </a>

            <a href="docs.html" class="entrance-card reveal reveal-d3">
              <div class="bg-image">
                <img src="assets/images/WIP.jpg" alt="教程与文档" />
              </div>
              <div class="overlay"></div>
              <div class="card-content">
                <h3>教程与文档</h3>
                <p>公开教程系列与内部资料索引。</p>
                <span class="btn btn-sm">查看文档</span>
              </div>
            </a>
          </div>
        </div>
      </section>
    </main>

    <div id="footer"></div>

    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
